# cargo-nextest settings for the workspace (2026-10-31).
#
# Run the tests with `cargo nextest run --workspace` (with `RUSTFLAGS="--cfg ci"`, so no test
# opens an audio device). nextest runs every test in its own process. That matters here:
# - each crate's integration tests are one program (`tests/app/main.rs` for the app,
#   `tests/it/main.rs` for a crate), and Slint allows one platform per process, while most
#   app tests install the offscreen platform;
# - tests don't share globals (the frozen offscreen clock, the generated fixture covers).
# `cargo test` runs a whole program in one process, so it can't run the app's program in one
# go; it still runs one app test at a time (`cargo test -p featherplay --test app -- <name>`).
# nextest doesn't run doctests: `cargo test --workspace --doc`.

# The timing tests run alone, in the `serial-perf` group: the group keeps them from
# overlapping each other, and `threads-required` makes each one take every test slot, so
# nothing else runs beside it either. One run, no separate step; the rest stay parallel.
[test-groups]
serial-perf = { max-threads = 1 }

# Frame-cost and CPU-time ceilings, and the measurements (ignored, run with
# `--run-ignored only`). Their numbers only mean something on an otherwise idle machine.
[[profile.default.overrides]]
filter = 'package(featherplay) & binary(app) & test(/^(smoothness|first_frames|home_scroll_bump|home_covers|lyrics_frames|related_scroll|scroll_frames|side_panel|render_timing|resize_frames|lyrics_gate|lyrics_toggle|lyrics_arrive|lyrics_button|skeleton_frames|content_fade|memory)::/)'
test-group = 'serial-perf'
threads-required = 'num-test-threads'

# The `ci` profile, for every push and pull request: everything but the frame-cost and
# CPU-time ceilings above, which draw 4K frames in software one at a time and take most of a
# full run (20 to 90 s each on a 2-core runner). The full suite, those included, runs weekly
# and before every release (`cargo nextest run --workspace`, the default profile).
[profile.ci]
default-filter = 'not (package(featherplay) & binary(app) & test(/^(smoothness|first_frames|home_scroll_bump|home_covers|lyrics_frames|related_scroll|scroll_frames|side_panel|render_timing|resize_frames|lyrics_gate|lyrics_toggle|lyrics_arrive|lyrics_button|skeleton_frames|content_fade|memory)::/))'

# Tests on Slint's real clock: they sleep a few hundred milliseconds and expect motion to have
# run (or not) in that time. Beside a full machine a frame can take longer than a fade, and
# `motion_idle` failed so ("the page appeared without its enter fade").
[[profile.default.overrides]]
filter = 'package(featherplay) & binary(app) & test(/^(motion_idle|playing_mark|paused_idle|library_refresh)::/)'
test-group = 'serial-perf'
threads-required = 'num-test-threads'

# The audio engine's real-clock stream test times a download against playback; beside a full
# machine it can miss its window (it fails about once in a few full runs and passes alone).
# It runs alone and gets two retries.
[[profile.default.overrides]]
filter = 'package(featherplay-audio) & test(engine_sounds_long_before_the_download_ends)'
test-group = 'serial-perf'
threads-required = 'num-test-threads'
retries = 2

# The audio engine beside a full CPU (ignored, a measurement): it fills every core itself,
# so it runs alone.
[[profile.default.overrides]]
filter = 'package(featherplay-audio) & test(/^under_load::/)'
test-group = 'serial-perf'
threads-required = 'num-test-threads'

# The resolver's and the controller's stream tests wait on tasks and notifications: one that
# never comes is ended after a minute, so a hang fails the run instead of holding the
# machine-wide build lock (a hung test held it for 47 minutes on 2026-11-06).
[[profile.default.overrides]]
filter = 'package(featherplay-streams) | (package(featherplay) & test(/^controller::/))'
slow-timeout = { period = "30s", terminate-after = 2 }

# Settings' Discord card, settled offscreen in a few seconds, and the activity sent to Discord,
# built without one: a test that hangs is ended after a minute too.
[[profile.default.overrides]]
filter = '(package(featherplay) & binary(app) & test(/^discord_card::/)) | (package(featherplay-integrations) & test(/^discord::/))'
slow-timeout = { period = "30s", terminate-after = 2 }

# Now playing's info block, settled offscreen in a few seconds: likewise.
[[profile.default.overrides]]
filter = 'package(featherplay) & binary(app) & test(/^now_playing_info::/)'
slow-timeout = { period = "30s", terminate-after = 2 }
