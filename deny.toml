# cargo-deny: `cargo deny check` (CI runs it on every push and pull request).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# featherplay ships for Windows x64 and ARM64 and for Linux x86_64 and aarch64, so the macOS,
# Android and wasm crates in the lockfile never build. Build and dev dependencies stay in:
# they run on our machines and CI.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
]

[advisories]
# The RustSec database, fetched on every run.
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = [
    # pin-utils, unmaintained: only Slint's build-time macros use it (slint-macros through
    # spin_on), never the app at run time. No known vulnerability; it goes when Slint drops it.
    { id = "RUSTSEC-2026-0441", reason = "build-time only, through slint-macros; no fix upstream yet" },
    # Linux, unmaintained, no successor yet. zvariant, zvariant_derive and zbus_names are
    # zbus's own crates (MPRIS, notifications, the keyring store, the tray and Slint's winit
    # backend use zbus); ttf-parser reads the fonts of winit's Wayland window frame
    # (sctk-adwaita, ab_glyph).
    { id = "RUSTSEC-2026-0370", reason = "zvariant, part of zbus; no known vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, part of zbus; no known vulnerability" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, part of zbus; no known vulnerability" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, through winit's Wayland frame; no known vulnerability" },
    # Crates no build compiles: the Windows-only tray-icon's Linux dependencies (gtk), which
    # the several targets bring into cargo-deny's graph (see [licenses] below).
    { id = "RUSTSEC-2024-0429", reason = "glib, only under tray-icon's Linux dependencies, which no build compiles" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error, only under tray-icon's Linux dependencies, which no build compiles" },
]

[licenses]
# Exactly the licences in the Windows and Linux dependency trees (and so in THIRD_PARTY.md).
# A new dependency under any other licence fails the check until it is reviewed and added here.
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "MPL-2.0",
  "ISC",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  # Linux only: webpki-root-certs, Mozilla's root certificates as data, for a system with no
  # CA certificates of its own.
  "CDLA-Permissive-2.0",
  # Slint (`slint`, `i-slint-*`) offers GPL-3.0-only OR this OR its Software License 3.0;
  # featherplay takes the Royalty-free License 2.0, so only that one is allowed.
  "LicenseRef-Slint-Royalty-free-2.0",
]
confidence-threshold = 0.9
# Given several targets, cargo-deny keeps a dependency whose cfg matches any of them, so the
# Windows-only tray-icon brings its Linux dependencies along (gtk, and at build time its
# system-deps), though no build compiles them. target-lexicon comes in that way; its licence
# is allowed for that crate only.
exceptions = [
  { crate = "target-lexicon", allow = ["Apache-2.0 WITH LLVM-exception"] },
]

[licenses.private]
# The workspace's own crates (`publish = false`) are MIT, from the root Cargo.toml.
ignore = true

[bans]
# The Slint and windows-rs trees bring several versions of the same crates; report them,
# don't fail on them.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace (and the vendored crate) carry no version.
allow-wildcard-paths = true

[sources]
# Only crates.io. The one patched crate is a path dependency in `vendor/`, which this check
# doesn't cover; there are no git dependencies.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
