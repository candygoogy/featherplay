# cargo-about config for THIRD_PARTY.md. Regenerate from the repo root with:
#   cargo about generate --offline -c packaging/third-party/about.toml --workspace \
#     -o THIRD_PARTY.md packaging/third-party/about.hbs
# Only what ships in featherplay.exe: the Windows x64 target, no build or dev dependencies.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Zlib",
  "MPL-2.0",
  "ISC",
  "BSL-1.0",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "MIT-0",
  "bzip2-1.0.6",
  # Slint ships no file for its licence; THIRD_PARTY.md links it (see about.hbs).
  "LicenseRef-Slint-Royalty-free-2.0",
]
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
