[package]
name = "featherplay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A light native Windows player for YouTube Music, in Rust and Slint"
publish = false

# The library holds everything but argument parsing, so `tests/` can reach `ui_bridge`.
[lib]
path = "src/lib.rs"

[[bin]]
name = "featherplay"
path = "src/main.rs"

[features]
# `FEATHERPLAY_COOKIES_FILE` (a plaintext cookie header) is read by debug builds only.
# This turns it on in a release build too, for measuring a release build on the dev
# cookie file. Never on in a published build.
dev-cookies-file = ["featherplay-controller/dev-cookies-file"]
# The performance harness's scripted run of the window (`src/perf.rs`), started by
# `FEATHERPLAY_PERF_SCRIPT`. Never on in a published build.
perf-harness = ["featherplay-platform/perf"]
# Updates from a test server on 127.0.0.1 with a test key (the controller's feature of the
# same name), for the AppImage update test. Never on in a published build.
update-test-server = ["featherplay-controller/update-test-server"]
# Windows only, on in the published Windows builds (`release.yml`): the main window draws with
# Skia on the GPU, Direct3D 12 through wgpu, with the processor (Skia in software) as a
# setting and as the fallback when the GPU can't make a surface (`app::renderer_name`). About
# 5.3 MB of exe. Without it everything draws in software, as the Linux build does.
gpu = ["slint/renderer-skia"]

[dependencies]
featherplay-audio = { path = "../../crates/audio" }
# The logic that needs no window: the controller, the catalog, scrobbling, presence, the
# update check, diagnostics (ARCHITECTURE.md, "Phase 3").
featherplay-controller = { path = "../../crates/controller" }
featherplay-core = { path = "../../crates/core" }
featherplay-integrations = { path = "../../crates/integrations" }
featherplay-lyrics = { path = "../../crates/lyrics" }
# What talks to the OS (ARCHITECTURE.md, "Phase 2").
featherplay-platform = { path = "../../crates/platform" }
featherplay-proxy = { path = "../../crates/proxy" }
featherplay-store = { path = "../../crates/store" }
featherplay-streams = { path = "../../crates/streams" }
featherplay-ytm = { path = "../../crates/ytm" }
# Offscreen `--snapshot`: skia in software mode, without a window.
i-slint-renderer-skia = { workspace = true }
# The dirty region type in that renderer's `RenderBuffer` trait.
i-slint-core = { workspace = true }
# Covers: decoded and resized off the UI thread; `--snapshot` writes PNGs.
image = { workspace = true, features = ["jpeg", "png", "webp"] }
# Reads the HWND out of `slint::WindowHandle`; slint doesn't re-export the trait.
raw-window-handle = { workspace = true }
# Covers are fetched with it. Its TLS is `featherplay-proxy`'s, as for every crate.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Names the files of the cover cache.
sha2 = { workspace = true }
# Skia in software (`winit` + `skia-software`) unless the `gpu` feature adds the GPU renderer.
# Software stays the lighter one: at 4K, shown, about 85 MB committed against the GPU's 340 MB
# plus 280 MB of video memory (2026-11-27).
# `unstable-winit-030` reaches winit's window: the wheel filter, and the tray's mini player
# (a borderless popup with no taskbar button, closed when it loses the activation).
slint = { workspace = true, features = ["std", "compat-1-2", "backend-winit", "renderer-skia-software", "raw-window-handle-06", "unstable-winit-030"] }
# `signal` for Ctrl+C, so the session is saved on exit.
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
# The tray's menu events go to the one muda handler that Slint's native menus (the search
# field's Cut, Copy, Paste, Select all) share (vendor/i-slint-backend-winit/VENDORED.md).
i-slint-backend-winit = { workspace = true }

[dev-dependencies]
# The text layout cache's counters (`testing`), for `tests/app/list_text_measure.rs`.
i-slint-core = { workspace = true, features = ["testing"] }
# This thread's cycles, the process's priority, its private bytes, heaps and allocations,
# for the measurements in `tests/app/`.
featherplay-platform = { path = "../../crates/platform", features = ["perf"] }
# Property tests of the code that reads covers and colours (`follow::backdrop`).
proptest = { workspace = true }
# Names a test's design covers by the SHA-1 of their URL, as `--fixtures` finds them.
sha1 = { workspace = true }
# A paused clock for the lyrics lookup's tests, whose sources answer seconds apart.
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
embed-resource = { workspace = true }
resvg = { workspace = true }
rspolib = { workspace = true }
slint-build = { workspace = true }

[lints]
workspace = true
