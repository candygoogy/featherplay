name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Once a week, the full suite (see the Test step).
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runners have no audio output device: `--cfg ci` ignores the engine tests that open one
  # (crates/audio/tests/it/engine_local.rs). Set for every step so they share one build cache.
  RUSTFLAGS: --cfg ci
  # The build keys (LASTFM_API_KEY, LASTFM_API_SECRET, DISCORD_CLIENT_ID) are read with
  # `option_env!`, so CI builds and tests without them: Last.fm falls back to the user's own
  # key, Discord status shows as unavailable. Only release.yml compiles them in.

jobs:
  # Known vulnerabilities, yanked crates, licences and crate sources, as deny.toml sets them.
  # Its own job, on Linux (the action is a container), so it reports in a minute without
  # waiting for the Windows build. The advisory database changes daily, so a run can fail
  # on a dependency nobody touched: update it, or record the reason in deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  # Nothing in the repository points at a developer's machine or at planning notes that
  # contributors can't see: comments state their rules themselves. The pattern is written with
  # character classes so this file doesn't match it.
  paths:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: No local paths or plan references
        shell: bash
        run: |
          if git grep -nIE 'D:/Work[s]pace|Docs/ytm[-]native|spec [§]|plan Tas[k]|Tas[k] 1[0-9]'; then
            echo "::error::Remove the local paths and plan references listed above."
            exit 1
          fi

  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Each crate's integration tests are one program, and the app's tests each install a Slint
      # platform (one per process), so they run under nextest: one process per test, the timing
      # tests alone (.config/nextest.toml). nextest skips doctests; the last line runs them.
      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          mkdir -p "$FEATHERPLAY_HOME"
          # Pushes and pull requests leave out the frame-cost and CPU-time ceilings (the `ci`
          # profile in .config/nextest.toml); the weekly run and release.yml run everything.
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then profile=default; else profile=ci; fi
          cargo nextest run --workspace --profile "$profile"
          cargo test --workspace --doc

  # Linux: clippy and the tests, as the `check` job runs them on Windows, on the offscreen
  # platform (no display). Two differences, both in the Test step: the `ci` profile always
  # (the frame-cost, CPU-time and memory ceilings were set on Windows), and pixel checks that
  # depend on the body font only save their images (an artifact). One run per architecture,
  # each native: x86_64, and aarch64 on GitHub's ARM64 runner (the same Ubuntu packages, from
  # its ports mirror; skia-bindings has prebuilt aarch64 libraries too). aarch64 is tested
  # here and in release.yml only, never by hand.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The headers the native crates build against: fontconfig and freetype (fonts),
      # xkbcommon, Wayland and X11 (winit), ALSA (cpal), D-Bus (no OpenSSL: rustls), and clang
      # for the bindings. skia-bindings downloads its prebuilt library. For the tests: a
      # session bus (dbus-run-session), and the Noto fonts, so the titles in other scripts
      # and the emoji find a fallback font (`glyph_fallback`).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libasound2-dev libdbus-1-dev \
            dbus fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      # Installs the toolchain and components named in rust-toolchain.toml, native to the
      # runner: fails if rustc's host isn't the machine's architecture.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$(uname -m)-unknown-linux-gnu" ]; then
            echo "::error::rustc's host is '$host' on a $(uname -m) runner"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      # FEATHERPLAY_PIXELS=unchecked: the app tests whose pixel checks measure text in the body
      # font (Segoe UI Variable, which Linux lacks) render, save the image to
      # FEATHERPLAY_TEST_SHOTS and skip those checks; Windows ignores it
      # (apps/featherplay/tests/app/support.rs). The tests get their own session bus, as a
      # desktop has one.
      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          export FEATHERPLAY_TEST_SHOTS="$RUNNER_TEMP/test-shots"
          export FEATHERPLAY_PIXELS=unchecked
          mkdir -p "$FEATHERPLAY_HOME" "$FEATHERPLAY_TEST_SHOTS"
          dbus-run-session -- cargo nextest run --workspace --profile ci
          dbus-run-session -- cargo test --workspace --doc

      - name: Test images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shots-${{ matrix.runner }}
          path: ${{ runner.temp }}/test-shots
          if-no-files-found: warn
          retention-days: 14

  # The ARM64 build, natively on windows-11-arm: weekly and when run by hand, so an ARM64
  # break shows before a release (release.yml tests ARM64 too). Not on every push, where it
  # would be a second full build. The `ci` profile: the frame-cost and CPU-time ceilings were
  # set on x64 machines.
  arm64:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ARM64 host toolchain, so nothing runs under x64 emulation.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup set default-host aarch64-pc-windows-msvc
          rustup toolchain install
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != aarch64-pc-windows-msvc ]; then
            echo "::error::rustc's host is '$host', not aarch64-pc-windows-msvc"
            exit 1
          fi

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          mkdir -p "$FEATHERPLAY_HOME"
          cargo nextest run --workspace --profile ci
          cargo test --workspace --doc

  # The Linux test rigs (phase 6 of 0.3.0), each in its own workflow file, run with every CI
  # run. Their reports and recordings are the runs' artifacts.
  rig-sound:
    uses: ./.github/workflows/linux-rig-sound.yml
  rig-desktop:
    uses: ./.github/workflows/linux-rig.yml
  rig-appimage:
    uses: ./.github/workflows/linux-rig-appimage.yml
