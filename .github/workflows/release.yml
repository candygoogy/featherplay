name: Release

# On a `v*` tag: build featherplay.exe for x64 and for ARM64 with the release profile from
# Cargo.toml (fat LTO, one codegen unit, strip, opt-level "z", the audio crates at 3), check
# their size budget, package a per-user installer for each with Inno Setup, build the Linux
# AppImage and .tar.gz (experimental; x86_64, and aarch64 tested automatically only), and
# attach them all to a draft GitHub Release with their SHA256 checksums. Publishing the
# draft stays a manual step.
#
# Dry run, from any branch: Actions > Release > Run workflow, or
#   gh workflow run release.yml --ref <branch>
# It runs every job but the last: tests, both builds, both installers, the Linux files, the
# checksums and the notes, all uploaded as the run's `release-assets` artifact. It creates no release and no
# tag, whatever the branch. Only a pushed `v*` tag runs `publish`.
#
# Jobs:
#   test         the whole x64 suite, on windows-2025
#   test-arm64   the `ci` profile, on windows-11-arm
#   build-arm64  the ARM64 exe, built natively on windows-11-arm after test-arm64
#   test-linux   the Linux suite, on ubuntu-24.04 and ubuntu-24.04-arm (the `ci` profile, as
#                CI's `linux` job)
#   build-linux  the AppImage and the .tar.gz, on ubuntu-22.04 and ubuntu-22.04-arm after
#                test-linux
#   package      the x64 exe, both installers (Inno runs on x64 only), the checksums
#   publish      the draft release, from package's artifact (tags only)
#
# Release assets. The x64 names are the ones 0.1.0 shipped with: the site, the README, Scoop
# and winget link to them, so they never change. ARM64 gets its own names beside them.
#   featherplay.exe                          the portable exe, x64
#   featherplay-setup-<version>.exe          the installer, x64 (packaging/windows/featherplay.iss)
#   featherplay-arm64.exe                    the portable exe, ARM64
#   featherplay-setup-<version>-arm64.exe    the installer, ARM64
#   featherplay-x86_64.AppImage              Linux, x86_64 (experimental); it updates itself in
#                                            place, so its name carries no version
#   featherplay-x86_64.tar.gz                the same program as a plain archive
#   featherplay-aarch64.AppImage             Linux, aarch64 (experimental, tested automatically
#   featherplay-aarch64.tar.gz               only: CI's ARM64 runner, never by hand)
#   <each of the above>.sha256               its `sha256sum` line (Scoop's autoupdate reads featherplay.exe.sha256)
#   SHA256SUMS.txt                           all of them, plus THIRD_PARTY.md: `sha256sum -c SHA256SUMS.txt`
#   THIRD_PARTY.md                           the licence notices, which a portable exe needs beside it
# The release notes list each file's SHA256 as well. One more file is added by hand, never
# here: SHA256SUMS.txt.minisig, the maintainer's signature on SHA256SUMS.txt, made on their
# PC with a key GitHub never sees (packaging/sign-release.sh, RELEASING.md step 4). The
# installed app's updater won't download a release without it.
#
# Build keys: three repository secrets, the same names as the variables in featherplay.env
# (Settings > Secrets and variables > Actions > New repository secret):
#   LASTFM_API_KEY, LASTFM_API_SECRET, DISCORD_CLIENT_ID
# They are compiled in with `option_env!`. Without them (a fork, say) the build still
# succeeds: Last.fm then needs the user's own API key and Discord status is unavailable.
# The run warns, and the draft's notes say so.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing by default; each job asks for what it needs. Only `publish` can write.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Each featherplay.exe must stay at 32 MB or less (raised from 31 MB on 2026-11-06 for the
  # Opus decoder, from 30 MB on 2026-10-31).
  # The helpers (yt-dlp, Deno) are downloaded at run time and don't count.
  MAX_EXE_BYTES: "32000000"
  # The Linux binary (stripped; the same one in both Linux files) must stay at 33 MB or
  # less: 29.3 MB at the first measurement (2026-11-12), 30.3 MB with the tray and the media
  # controls, 32.1 MB with rustls compiled in instead of the system's OpenSSL (raised from
  # 31 MB on 2026-11-12, so no distro needs a particular OpenSSL).
  MAX_LINUX_BIN_BYTES: "33000000"
  # The newest glibc the Linux binary may need: that of ubuntu-22.04, where it's built. It
  # then runs on Ubuntu 22.04, Debian 12, Fedora 36 and anything newer.
  LINUX_MAX_GLIBC: "2.35"
  # Inno Setup, pinned: the official installer from jrsoftware/issrc's GitHub release, checked
  # against this SHA256 (the release's own asset digest) before it runs.
  INNO_VERSION: "6.7.4"
  INNO_SHA256: "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c"
  # Where build-installer.sh --arch arm64 looks for the ARM64 exe (cargo's path for
  # `--target aarch64-pc-windows-msvc`).
  ARM64_EXE: target/aarch64-pc-windows-msvc/release/featherplay.exe

jobs:
  # The whole test suite, the frame-cost and CPU-time ceilings included (CI's per-push run
  # leaves those out): a release is built only from a commit that passes all of it.
  test:
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: --cfg ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          mkdir -p "$FEATHERPLAY_HOME"
          cargo nextest run --workspace --locked
          cargo test --workspace --doc --locked

  # The suite on ARM64, natively. The `ci` profile: everything but the frame-cost and
  # CPU-time ceilings, whose numbers were set on x64 machines (the x64 job runs them).
  test-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: --cfg ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The ARM64 host toolchain, so the build and the tests are native ARM64, not x64 under
      # emulation. Fails if rustc's host is anything else.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup set default-host aarch64-pc-windows-msvc
          rustup toolchain install
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != aarch64-pc-windows-msvc ]; then
            echo "::error::rustc's host is '$host', not aarch64-pc-windows-msvc"
            exit 1
          fi

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          mkdir -p "$FEATHERPLAY_HOME"
          cargo nextest run --workspace --locked --profile ci
          cargo test --workspace --doc --locked

  # The ARM64 exe, built on ARM64 (Skia's prebuilt aarch64-pc-windows-msvc binaries, the
  # image's ARM64 MSVC tools). package puts it into the release beside the x64 one.
  build-arm64:
    needs: test-arm64
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup set default-host aarch64-pc-windows-msvc
          rustup toolchain install
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != aarch64-pc-windows-msvc ]; then
            echo "::error::rustc's host is '$host', not aarch64-pc-windows-msvc"
            exit 1
          fi

      - name: Build
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: cargo build --release --locked -p featherplay

      - name: Check the exe size
        shell: bash
        run: |
          size=$(stat -c %s target/release/featherplay.exe)
          echo "featherplay.exe (ARM64): $size bytes (limit $MAX_EXE_BYTES)"
          if [ "$size" -gt "$MAX_EXE_BYTES" ]; then
            echo "::error::the ARM64 featherplay.exe is $size bytes, over the $MAX_EXE_BYTES byte budget"
            exit 1
          fi

      # The Visual C++ runtime the installer ships beside the exe, from this image: no older
      # than the toolset that just linked the exe (packaging/windows/build-installer.sh).
      - name: Collect the Visual C++ runtime
        shell: bash
        run: |
          crt=$(packaging/windows/find-vcredist.sh arm64)
          echo "Visual C++ runtime: $crt"
          mkdir -p target/release/crt
          cp "$crt"/*.dll target/release/crt/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: featherplay-arm64-exe
          path: |
            target/release/featherplay.exe
            target/release/crt/
          if-no-files-found: error
          retention-days: 7

  # The Linux suite, as CI's `linux` job runs it: the `ci` profile (the frame-cost, CPU-time
  # and memory ceilings were set on Windows), the pixel checks that measure the body font
  # only saving their images, and a session bus of their own. One entry per architecture,
  # each on its own native runner (aarch64 on GitHub's ARM64 one: the same packages, from
  # Ubuntu's ports mirror).
  test-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      RUSTFLAGS: --cfg ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The headers the build needs (as in ci.yml), and for the tests a session bus and the
      # Noto fonts.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libasound2-dev libdbus-1-dev \
            dbus fonts-noto-core fonts-noto-cjk fonts-noto-color-emoji

      # Native to the runner: fails if rustc's host isn't the machine's architecture.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$(uname -m)-unknown-linux-gnu" ]; then
            echo "::error::rustc's host is '$host' on a $(uname -m) runner"
            exit 1
          fi

      - uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: nextest

      - name: Test
        shell: bash
        run: |
          export FEATHERPLAY_HOME="$RUNNER_TEMP/featherplay-home"
          export FEATHERPLAY_TEST_SHOTS="$RUNNER_TEMP/test-shots"
          export FEATHERPLAY_PIXELS=unchecked
          mkdir -p "$FEATHERPLAY_HOME" "$FEATHERPLAY_TEST_SHOTS"
          dbus-run-session -- cargo nextest run --workspace --locked --profile ci
          dbus-run-session -- cargo test --workspace --doc --locked

  # The Linux files, made by packaging/linux/build-linux.sh on the oldest Ubuntu image GitHub
  # has, for each architecture natively (ubuntu-22.04, and ubuntu-22.04-arm for aarch64), so
  # the binary needs no newer glibc than that image's (LINUX_MAX_GLIBC, the same on both). The
  # script downloads appimagetool and the AppImage runtime for the machine's architecture,
  # pinned by version and SHA256, checks the binary's architecture, size (one budget for both)
  # and glibc, and validates the desktop entry and the AppStream metadata. package takes every
  # `featherplay-linux-*` artifact.
  build-linux:
    needs: test-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The headers the build needs (as in ci.yml), the checkers for the desktop entry and
      # the metadata, and patchelf (build-linux.sh's AppImage libraries).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libfontconfig1-dev libfreetype-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libasound2-dev libdbus-1-dev \
            desktop-file-utils appstream patchelf

      # Native to the runner, as in test-linux.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "$(uname -m)-unknown-linux-gnu" ]; then
            echo "::error::rustc's host is '$host' on a $(uname -m) runner"
            exit 1
          fi

      # The same secrets as the Windows builds; package warns if they're missing.
      - name: Build
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: cargo build --release --locked -p featherplay

      - name: Package
        shell: bash
        run: |
          MAX_BIN_BYTES="$MAX_LINUX_BIN_BYTES" MAX_GLIBC="$LINUX_MAX_GLIBC" \
            TOOLS_DIR="$RUNNER_TEMP/linux-tools" packaging/linux/build-linux.sh --skip-build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: featherplay-linux-${{ matrix.arch }}
          path: |
            target/linux/featherplay-${{ matrix.arch }}.AppImage
            target/linux/featherplay-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  package:
    needs: [test, build-arm64, build-linux]
    # Pinned rather than windows-latest, so an image change can't move the build under us.
    # (The image ships Inno Setup 6.7.1 too; we install 6.7.4, the version the installer was
    # tested with, so the result doesn't depend on the image.)
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain and components named in rust-toolchain.toml.
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # A tag must match the crate version; a dry run takes the crate version as it is.
      - name: Read the version
        shell: bash
        run: |
          pkgid=$(cargo pkgid -p featherplay)
          version=${pkgid##*[@#]}
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the crate version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'is-' + ($env:INNO_VERSION -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$env:INNO_VERSION.exe"
          $setup = Join-Path $env:RUNNER_TEMP "innosetup-$env:INNO_VERSION.exe"
          Invoke-WebRequest -Uri $url -OutFile $setup
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          if ($hash -ne $env:INNO_SHA256) {
            Write-Output "::error::innosetup-$env:INNO_VERSION.exe has SHA256 $hash, expected $env:INNO_SHA256"
            exit 1
          }
          # Portable mode for the current user: no admin, no uninstaller, no registry entries.
          $dir = Join-Path $env:RUNNER_TEMP 'inno-setup'
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-',
            '/CURRENTUSER', '/PORTABLE=1', '/NOICONS', "/DIR=`"$dir`"")
          if ($p.ExitCode -ne 0) {
            Write-Output "::error::the Inno Setup installer exited with $($p.ExitCode)"
            exit 1
          }
          $iscc = Join-Path $dir 'ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) {
            Write-Output "::error::no ISCC.exe in $dir"
            exit 1
          }
          "ISCC=$($iscc -replace '\\', '/')" >> $env:GITHUB_ENV

      # Says whether the keys are there, never what they are. build-arm64 compiled in the
      # same secrets.
      - name: Check the build keys
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          missing=
          for name in LASTFM_API_KEY LASTFM_API_SECRET DISCORD_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::building without the secrets:$missing. Without the Last.fm pair, Last.fm needs the user's own API key; without DISCORD_CLIENT_ID, Discord status is unavailable."
          fi
          echo "MISSING_KEYS=${missing# }" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: cargo build --release --locked -p featherplay

      - name: Check the exe size
        shell: bash
        run: |
          size=$(stat -c %s target/release/featherplay.exe)
          echo "featherplay.exe: $size bytes (limit $MAX_EXE_BYTES)"
          if [ "$size" -gt "$MAX_EXE_BYTES" ]; then
            echo "::error::featherplay.exe is $size bytes, over the $MAX_EXE_BYTES byte budget"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: featherplay-arm64-exe
          path: target/aarch64-pc-windows-msvc/release

      # Every architecture's AppImage and .tar.gz, from build-linux.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: featherplay-linux-*
          path: target/linux
          merge-multiple: true

      # Each exe is the architecture its name says: the PE header's machine field.
      - name: Check the exes' architectures
        shell: bash
        run: |
          machine() {
            local pe
            pe=$(od -An -tu4 -j60 -N4 "$1" | tr -d ' ')
            od -An -tx2 -j$((pe + 4)) -N2 "$1" | tr -d ' '
          }
          x64=$(machine target/release/featherplay.exe)
          arm64=$(machine "$ARM64_EXE")
          echo "machine: x64 exe $x64, ARM64 exe $arm64"
          if [ "$x64" != 8664 ] || [ "$arm64" != aa64 ]; then
            echo "::error::expected machine 8664 (x64) and aa64 (ARM64), got $x64 and $arm64"
            exit 1
          fi

      # Packages the exes built above (--skip-build); the keys are already compiled in.
      - name: Build the installers
        shell: bash
        run: |
          packaging/windows/build-installer.sh --skip-build
          # The ARM64 runtime came with the ARM64 exe, from the image that built it.
          VCREDIST_DIR="$(dirname "$ARM64_EXE")/crt" \
            packaging/windows/build-installer.sh --arch arm64 --skip-build

      - name: Checksums
        shell: bash
        run: |
          setup="featherplay-setup-$VERSION.exe"
          setup_arm64="featherplay-setup-$VERSION-arm64.exe"
          mkdir dist
          cp target/release/featherplay.exe dist/
          cp "$ARM64_EXE" dist/featherplay-arm64.exe
          cp "target/installer/$setup" "target/installer/$setup_arm64" dist/
          cp target/linux/featherplay-*.AppImage target/linux/featherplay-*.tar.gz dist/
          cp THIRD_PARTY.md dist/
          cd dist
          linux=()
          for arch in x86_64 aarch64; do
            for f in "featherplay-$arch.AppImage" "featherplay-$arch.tar.gz"; do
              if [ ! -f "$f" ]; then
                echo "::error::build-linux's $f is missing"
                exit 1
              fi
              linux+=("$f")
            done
          done
          files=(featherplay.exe "$setup" featherplay-arm64.exe "$setup_arm64" "${linux[@]}")
          for f in "${files[@]}"; do
            sha256sum "$f" > "$f.sha256"
          done
          sha256sum "${files[@]}" THIRD_PARTY.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        shell: bash
        run: |
          setup="featherplay-setup-$VERSION.exe"
          setup_arm64="featherplay-setup-$VERSION-arm64.exe"
          {
            echo "featherplay $VERSION for Windows 10 and 11, x64 and ARM64."
            echo
            echo "- \`$setup\`: the installer for x64 PCs (per user, no admin prompt). It also runs on ARM64 Windows 11, under emulation."
            echo "- \`$setup_arm64\`: the installer for ARM64 PCs, such as Snapdragon laptops."
            echo "- \`featherplay.exe\` (x64) and \`featherplay-arm64.exe\` (ARM64): the portable exes. Keep \`THIRD_PARTY.md\` with them; it holds the licence notices."
            echo
            echo "Linux (experimental), for Ubuntu 22.04, Debian 12, Fedora 36 or newer:"
            echo
            echo "- \`featherplay-x86_64.AppImage\`: for x86_64 PCs. Make it executable and run it. It updates itself."
            echo "- \`featherplay-x86_64.tar.gz\`: the same program as plain files, with a README on installing it. It tells you about updates but doesn't install them."
            echo "- \`featherplay-aarch64.AppImage\` and \`featherplay-aarch64.tar.gz\`: the same two for 64-bit ARM (aarch64). Experimental, tested automatically only."
            echo
            echo "SHA256:"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            if [ -n "$MISSING_KEYS" ]; then
              echo
              echo "**Built without the secrets $MISSING_KEYS.** Without the Last.fm key and secret, Last.fm needs your own API key in this build; without the Discord client ID, Discord status is unavailable."
            fi
          } > dist/notes.md

      # A dry run ends here: the run's page has every asset, the notes included.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 14

  # Only for a pushed tag, and the only job that can write: it gets package's files and
  # runs nothing from the repository.
  publish:
    needs: package
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # gh release create.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          setup="featherplay-setup-$version.exe"
          setup_arm64="featherplay-setup-$version-arm64.exe"
          linux=()
          for f in dist/featherplay-*.AppImage dist/featherplay-*.tar.gz; do
            linux+=("$f" "$f.sha256")
          done
          gh release create "$GITHUB_REF_NAME" \
            "dist/featherplay.exe" "dist/featherplay.exe.sha256" \
            "dist/$setup" "dist/$setup.sha256" \
            "dist/featherplay-arm64.exe" "dist/featherplay-arm64.exe.sha256" \
            "dist/$setup_arm64" "dist/$setup_arm64.sha256" \
            "${linux[@]}" \
            "dist/SHA256SUMS.txt" "dist/THIRD_PARTY.md" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "featherplay $GITHUB_REF_NAME" \
            --notes-file dist/notes.md
