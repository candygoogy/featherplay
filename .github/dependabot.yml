# Weekly dependency updates, grouped so a normal week brings at most one pull request per
# ecosystem. Security updates for known advisories still arrive on their own as needed.
# A release must be a week old before it is proposed, so a hijacked or broken publish has
# time to be caught and yanked first.
version: 2

updates:
  # The workspace pins every dependency exactly (`=1.2.3` in the root Cargo.toml), so a bump
  # has to rewrite the pin as well as Cargo.lock: `increase` does that.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      # Slint's crates (slint, slint-build, i-slint-core, i-slint-renderer-skia) must move
      # together. vendor/i-slint-renderer-skia is a patched copy of one of them: a Slint
      # update has to refresh that copy in the same pull request (see its VENDORED.md), or
      # the patch stops applying and the exe grows by the wgpu code it removes.
      slint:
        patterns: ["slint", "slint-*", "i-slint-*"]
      cargo-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["slint", "slint-*", "i-slint-*"]
        update-types: [minor, patch]

  # Every action is pinned to a commit SHA with its version in a comment; Dependabot updates
  # both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # The website (pnpm, with site/pnpm-lock.yaml). Exact pins in package.json are bumped
  # along with the lockfile.
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 2
    commit-message:
      prefix: build
      include: scope
    groups:
      site-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
