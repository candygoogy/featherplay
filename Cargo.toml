[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# `vendor` holds patched third-party crates, which stay out of our clippy and fmt runs.
exclude = ["vendor"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/candygoogy/featherplay"
homepage = "https://featherplay.candygoogy.dev"

# Every member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
# An `unsafe fn` body is not one big unsafe block: each unsafe operation inside it needs its
# own `unsafe {}` with its own SAFETY comment.
unsafe_op_in_unsafe_fn = "deny"
# `--cfg ci` (RUSTFLAGS) ignores the tests that need an output device.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(ci)"] }

[workspace.lints.clippy]
# Every `unsafe` block says, in a `// SAFETY:` comment, which invariant makes it sound.
undocumented_unsafe_blocks = "warn"
# A release build is a GUI program: stdout and stderr go nowhere. Everything goes through
# the app's log (`log!`, the `log` crate); only command-line output, the logger's own echo
# and tests may print, each with an `#[allow]` saying why.
print_stderr = "deny"
print_stdout = "deny"

# Exact pins for the whole workspace. Members add the features they need.
# `default-features = false` is set where members must trim defaults
# (a member cannot turn off defaults that the workspace entry leaves on).
[workspace.dependencies]
slint = { version = "=1.18.1", default-features = false }
slint-build = "=1.18.1"
ytmapi-rs = { version = "=0.3.3", default-features = false }
rodio = { version = "=0.23.0", default-features = false }
# `system-proxy`: every client goes through Windows' manual proxy when one is set, as it does
# through `HTTPS_PROXY`/`HTTP_PROXY` (hyper-util reads both). A proxy script and
# auto-detection are `crates/proxy`'s, whose builder every client starts from.
# The TLS is `crates/proxy`'s too (every crate with a client depends on it, so the feature
# reaches them all): native-tls on Windows, which is SChannel; elsewhere rustls, built into
# the binary, so it links no libssl (Fedora 45 moved to OpenSSL 4, and a binary linked to
# OpenSSL 3 doesn't start there).
reqwest = { version = "=0.13.5", default-features = false, features = ["system-proxy"] }
# Not Windows: whether the system has any CA certificates, as rustls-platform-verifier reads
# them, and Mozilla's roots for when it has none (`crates/proxy`'s `roots`).
rustls-native-certs = "=0.8.5"
webpki-root-certs = "=1.0.11"
tokio = "=1.54.1"
# Tests only (dev-dependencies): property tests of the parsers that read outside input.
# Without the default `fork` and `timeout`, which no test uses.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Windows only: the media card (SMTC). Neither of its D-Bus backends: Linux's MPRIS is
# `platform::media_controls`' own, over zbus.
souvlaki = { version = "=0.9.3", default-features = false }
tray-icon = "=0.26.1"
# Linux's tray: a StatusNotifierItem and its menu over D-Bus, no GTK. On zbus 5 with async-io
# (Slint's and the Secret Service store's), its blocking API on a thread of its own; adds four
# small crates (arc-swap, crossbeam-queue, pastey, task-local).
ksni = { version = "=0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Linux, X11: where the mini player goes (the pointer, the monitors, the work area). In the
# tree already through winit.
x11rb = { version = "=0.13.2", default-features = false }
# 0.10: on X11, the Quote, NumpadEnter and NumpadEqual keys register (Windows' code is
# unchanged from 0.9).
global-hotkey = "=0.10.0"
tauri-winrt-notification = "=0.8.1"
discord-rich-presence = "=1.1.0"
webview2-com = "=0.39.1"
# The keyring project's core API and its Windows Credential Manager store, used directly
# rather than through the `keyring` crate: it turns on the store's `search` feature,
# whose regex we never call.
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }
# The Secret Service store (GNOME Keyring, KWallet) for keyring-core on Linux. Pure Rust over
# zbus, which Slint's winit backend brings in already, on zbus's own async-io thread, so it
# works from any thread with no runtime around; the session with the service is encrypted
# with Rust's crypto crates (aes, cbc, hkdf, sha2), no OpenSSL.
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-async-io-crypto-rust"] }
# Linux only: the browser sign-in reads the cookie database (SQLite) its closed browser kept.
# SQLite built in (`bundled`): rusqlite 0.43 needs SQLite 3.45.3, newer than Ubuntu 22.04's and
# Debian 12's, and a linked libsqlite3 would be one more library the AppImage and the archive
# need. Without the default statement cache (hashlink) and its WebAssembly backend; the SQLite
# extensions the read doesn't use are left out by `.cargo/config.toml` (LIBSQLITE3_FLAGS).
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled"] }
# Linux only, in the tree already (the Secret Service store, with these features): Chromium's
# cookie values, AES-128-CBC under its basic store's fixed key.
aes = "=0.9.4"
cbc = { version = "=0.2.1", features = ["block-padding", "alloc"] }
# Tests only, in the tree already: the key's derivation (PBKDF2's one round is an HMAC-SHA1).
hmac = "=0.13.0"
# Linux: the process group the browser sign-in starts its browser with, and its signals;
# thread priority, CPU times, the local time and signals in `platform`'s Linux module.
libc = "=0.2.191"
windows = "=0.62.2"
# Linux only, all in the lock tree already through Slint. fontconfig's C API, linked as
# fontique links it: `platform::fonts` asks it for the fallback families.
yeslogic-fontconfig-sys = "=6.0.1"
# The clipboard for `platform::clipboard` (Slint's winit backend uses it for its own).
arboard = { version = "=3.7.0", default-features = false }
# Linux only, in the lock tree already (Slint, the Secret Service store): the session bus that
# `platform::media_controls` serves MPRIS on and `platform::notify` sends notifications over,
# and the tray test's stand-in StatusNotifierWatcher.
zbus = "=5.19.0"
# The window handle `featherplay-platform` takes, and that the app reads out of Slint's window.
raw-window-handle = "=0.6.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
toml = "=1.1.8"
md-5 = "=0.11.0"
sha2 = "=0.11.1"
# Checks the minisign signature on a release's SHA256SUMS.txt before an update downloads.
# Pure Rust, no dependencies (its own Ed25519 and BLAKE2b), MIT.
minisign-verify = "=0.3.0"
zip = { version = "=9.1.0", default-features = false }
# Deflates embedded data at build time and inflates it at runtime; in the tree already (zip, png).
flate2 = "=1.1.10"
# QuickJS-NG, the JavaScript engine that runs YouTube's player challenges inside the app
# (crates/streams/src/js.rs). C, built by `cc` with the bindings the crate ships for both
# Windows targets (no bindgen, no libclang). No default features beyond `std`: no module
# loader, no macros. `allocator` gives each run a heap of its own (`js.rs`, `RunHeap`).
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "allocator"] }
# For the UI. Each one is already in the lock tree through slint or ytmapi-rs.
# Cover decoding and resizing, and the PNGs that `--snapshot` writes.
image = { version = "=0.25.10", default-features = false }
# `--snapshot` renders offscreen by driving slint's skia renderer in software mode directly.
i-slint-renderer-skia = { version = "=1.18.1", default-features = false }
# Names the dirty region in the skia renderer's `RenderBuffer` trait, for the offscreen
# windows that present like softbuffer does (`offscreen::install_presenting`).
i-slint-core = { version = "=1.18.1", default-features = false }
# Hands the tray's menu events to the one muda handler, which Slint's menus share
# (vendor/i-slint-backend-winit/VENDORED.md, change 5).
i-slint-backend-winit = { version = "=1.18.1", default-features = false }
# Rasterises the Tri-vane logo into the window, exe and tray icons at build time.
resvg = { version = "=0.48.1", default-features = false }
# Embeds the logo `.ico` into featherplay.exe as its icon resource (rc.exe from the SDK).
embed-resource = "=3.0.12"
# `--fixtures` finds the design covers by the SHA-1 of their URL, the names they were saved under.
sha1 = "=0.11.0"
# The log facade: the crates log through it, the app writes the records to its log file.
log = "=0.4.34"
# The local API's server (crates/integrations/src/local_api). hyper and its helpers are
# already in the tree through reqwest's client; the server adds hyper's `server` feature.
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
# The WebSocket handshake's `Sec-WebSocket-Accept` (base64 of a SHA-1); in the tree already.
base64 = { version = "=0.23.1", default-features = false }
# The local API's token, from the system's CSPRNG; in the tree already (tempfile).
getrandom = "=0.4.3"
# Translations: the build script reads the `.po` files for the Rust side's catalogue with the
# parser slint-build uses; in the tree already.
rspolib = "=0.1.2"

# Slint's skia renderer with `wgpu-30` taken out of its default features (which
# i-slint-backend-winit turns on), plus two stub constructors so winit still compiles.
# We render with skia-software only, so wgpu was ~1 MB of dead code in the exe.
# See vendor/i-slint-renderer-skia/VENDORED.md.
[patch.crates-io]
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
# Slint's winit backend, with its frame pacing asking for one paint per redraw, not two.
# See vendor/i-slint-backend-winit/VENDORED.md.
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
# The pure-Rust Opus decoder with its naive DFT swapped for rustfft (4-5x realtime to ~325x).
# See vendor/opus-decoder/VENDORED.md.
opus-decoder = { path = "vendor/opus-decoder" }
# symphonia-core with its FFT twiddle tables built on first use, not stored zero-filled in the
# binary (0.5 MB). See vendor/symphonia-core/VENDORED.md.
symphonia-core = { path = "vendor/symphonia-core" }

# Full debug info made each UI test's PDB ~560 MB, and a workspace test run links dozens
# of them. Line tables (~158 MB) keep file:line in panics and backtraces; dependencies
# get none.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
# QuickJS is C, built with its package's opt-level. Unoptimised, a debug build would take
# several times longer to preprocess a new player and to load one for each song.
[profile.dev.package.rquickjs-sys]
opt-level = 3

# The exe must stay at 32 MB or less (`release.yml` checks it). Fat LTO with one codegen unit and
# size-optimised code gets it there; the audio path and the cover decoders keep full speed below.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# "z" since the 2026-10-28 UI polish took "s" to 30.6 MB.
opt-level = "z"

# Decoding and output run all the time while playing, so they stay at opt-level 3.
[profile.release.package.featherplay-audio]
opt-level = 3
[profile.release.package.rodio]
opt-level = 3
[profile.release.package.cpal]
opt-level = 3
[profile.release.package.dasp_sample]
opt-level = 3
[profile.release.package.symphonia]
opt-level = 3
[profile.release.package.symphonia-core]
opt-level = 3
[profile.release.package.symphonia-codec-aac]
opt-level = 3
[profile.release.package.symphonia-format-isomp4]
opt-level = 3
# The Opus path too (2026-11-14): nearly every song is Opus, and its decoder thread is half of
# the CPU while playing. At 3 that thread takes a sixth less (0.030 to 0.026 % of a 16-thread
# machine) for 71 KB of the exe. It was left at "z" on 2026-11-06, when the exe had ~0.3 MB to
# spare and "z" already decoded at ~250x realtime.
[profile.release.package.opus-decoder]
opt-level = 3
[profile.release.package.rustfft]
opt-level = 3
[profile.release.package.symphonia-format-mkv]
opt-level = 3

# QuickJS loads YouTube's player for every song (~15 ms from its bytecode) and preprocesses each
# new player (~4 s). At "z" those took 15-100 % longer (a load 35 ms instead of 18, preprocessing
# 6.0-6.4 s instead of 3.7-3.9). At 3, with its Rust side, the engine took the exe from
# 30,456,320 to 31,681,536 B, ~0.3 MB more than at "z" (2026-11-09).
[profile.release.package.rquickjs-sys]
opt-level = 3
[profile.release.package.rquickjs-core]
opt-level = 3

# Covers are decoded, cropped and resized on tokio's blocking pool for every page shown, and
# that was most of a page's CPU. These crates at opt-level 3 speed up the decoding (~160 KB,
# 2026-11-08). Only their own code gets the level: image's generic code, `resize` among it, is
# compiled in the app at "z", so the resize is the app's own (`covers/resize.rs`, SSE2 on
# x86-64). Slint's runtime, renderer and text crates at 3 cost ~950 KB and made a frame only
# 3-11 % cheaper, within the noise: they stay at "z".
[profile.release.package.image]
opt-level = 3
[profile.release.package.image-webp]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.zune-core]
opt-level = 3
[profile.release.package.png]
opt-level = 3
[profile.release.package.fdeflate]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.simd-adler32]
opt-level = 3
[profile.release.package.crc32fast]
opt-level = 3
