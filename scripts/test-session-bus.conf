<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- A session bus for the tests, given to dbus-run-session as its config file
     (CONTRIBUTING.md has the command). It is the stock session bus without the service
     folders, so nothing can be started through it. A test then finds what CI finds, a bus
     with no keyring, notification daemon or portal on it, whatever the desktop it runs on
     has installed. With the stock bus on a desktop that runs GNOME Keyring, a call to the
     Secret Service starts a second keyring daemon, which hands over to the desktop's own
     and never answers on this bus: each call then waits out its 25 s. -->
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
