[package]
name = "featherplay-lyrics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's lyrics: the LRC format and the LRCLIB lookup"
publish = false

[dependencies]
# The HTTP client follows the proxy settings (`featherplay_proxy::client`).
featherplay-proxy = { path = "../proxy" }
# Its TLS is `featherplay-proxy`'s, as for every crate.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
