[package]
name = "featherplay-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's platform layer: everything that talks to the operating system, one module per OS"
publish = false

[features]
# The performance harness's process, heap and window queries (`perf`), and the CPU-time,
# cycle and commit-charge queries the measurements take (`thread`, `memory`). The app's
# `perf-harness` feature and the audio crate's tests turn it on; never on in a published
# build. The cycle counts and the commit charge need two more `windows` features.
perf = ["windows/Win32_System_ProcessStatus", "windows/Win32_System_WindowsProgramming"]

[dependencies]
# Translations (`tr!`) for the strings the platform code shows, such as the tray menu's.
featherplay-core = { path = "../core" }
# `window::Handle::from_raw`: the window handle the window functions take, read from the
# windowing library's raw handle: an HWND on Windows, an X11 window or Wayland surface on Linux.
raw-window-handle = { workspace = true }
# `credentials`: the store API the OS's credential store sits behind.
keyring-core = { workspace = true }
# Warnings from the OS calls, which reach the app's log file.
log = { workspace = true }
# `tray`: inflates the tray icons, which `build.rs` deflates.
flate2 = { workspace = true }

# The OS crates the Windows code uses, and the `windows` features it needs: each one names a
# module the code imports from (Security and Storage_FileSystem for the functions there that
# take their types).
[target.'cfg(windows)'.dependencies]
# `media_controls`: the media card (SMTC).
souvlaki = { workspace = true }
# `notify`: toasts.
tauri-winrt-notification = { workspace = true }
# `tray`: the tray icon and its menu.
tray-icon = { workspace = true }
# `webview`: WebView2 for the sign-in window.
webview2-com = { workspace = true }
# `credentials`: the Credential Manager store.
windows-native-keyring-store = { workspace = true }
windows = { workspace = true, features = [
    "Media",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# `media_controls`, `notify` and `bus`: MPRIS, notifications and the session bus checks.
zbus = { workspace = true }
# `bus::call`: the arguments' bound.
serde = { workspace = true }
# `credentials`: the Secret Service store.
zbus-secret-service-keyring-store = { workspace = true }
# `browsers::launch`: the DevTools pipe on descriptors 3 and 4, the browser's process group;
# `thread`, `system`, `memory` and `session_end`: scheduler, time, allocator and signal calls.
libc = { workspace = true }
# `browsers`: the browsers' JSON policy files.
serde_json = { workspace = true }
# `fonts`: asks fontconfig for the fallback families.
yeslogic-fontconfig-sys = { workspace = true }
# `clipboard`: the X11 or Wayland clipboard, as Slint's winit backend reaches it.
arboard = { workspace = true, features = ["wayland-data-control"] }
# `tray`: the StatusNotifierItem and its menu.
ksni = { workspace = true }
# `window`, on X11: the pointer, the monitors, the work area and the scale the mini player is
# placed with.
x11rb = { workspace = true, features = ["randr", "resource_manager"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
# The tray test's stand-in StatusNotifierWatcher and its calls to the item.
zbus = { workspace = true }

[build-dependencies]
# Renders the colour Tri-vane (apps/featherplay/ui/logo/tri-vane{,-light}{,-16,-24}.svg) for the tray.
resvg = { workspace = true }
flate2 = { workspace = true }

[lints]
workspace = true
