[package]
name = "featherplay-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's saved state: paths, settings, the session, Credential Manager secrets and the Library cache"
publish = false

[dependencies]
featherplay-core = { path = "../core" }
# What talks to the OS (ARCHITECTURE.md, "Phase 2"); its code moves in area by area.
featherplay-platform = { path = "../platform" }
keyring-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[target.'cfg(windows)'.dependencies]
# The Credential Manager store behind `keyring-core` (`secrets.rs`).
windows-native-keyring-store = { workspace = true }

[lints]
workspace = true
