[package]
name = "featherplay-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's proxy choice for every HTTP client and yt-dlp: the environment, else Windows' auto-detection, proxy script or manual proxy; DNS over HTTPS for YouTube's hosts on request"
publish = false

[dependencies]
# What talks to the OS (ARCHITECTURE.md, "Phase 2").
featherplay-platform = { path = "../platform" }
# What a lookup found, or how it failed, goes to the app's log file.
log = { workspace = true }
# `doh`: the services' JSON answers, and the system's lookups on tokio's blocking pool, as
# reqwest's own resolver runs them. Both in the tree already.
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
# The matcher reqwest's own clients pick a proxy with (the environment, then Windows' manual
# proxy and its exceptions). A request still goes by it until a script or auto-detection
# says otherwise. In the tree through reqwest, with these features.
hyper-util = { workspace = true, features = ["client-proxy", "client-proxy-system"] }

# The TLS of every client in the app, since every crate with one depends on this crate
# (the workspace's `reqwest` says why). Windows: SChannel, through native-tls.
[target.'cfg(windows)'.dependencies]
reqwest = { workspace = true, features = ["native-tls"] }

# Elsewhere: rustls, checking certificates against the system's store as OpenSSL did
# (rustls-platform-verifier: SSL_CERT_FILE/SSL_CERT_DIR, else the distribution's bundle).
# Its crypto is aws-lc, reqwest's own choice: ring would need ytmapi-rs patched, whose TLS
# features are native-tls or reqwest's `rustls` (aws-lc), one of them required.
# With no system store at all (a container without `ca-certificates`), Mozilla's roots built
# into the binary (`roots`): rustls-native-certs tells, as the platform verifier reads the
# store, and webpki-root-certs holds them. Both in the lockfile already.
[target.'cfg(not(windows))'.dependencies]
reqwest = { workspace = true, features = ["rustls"] }
rustls-native-certs = { workspace = true }
webpki-root-certs = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
