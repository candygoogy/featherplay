[package]
name = "featherplay-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's Windows integrations: media controls, taskbar buttons, tray, toasts, hotkeys, SponsorBlock and Discord"
publish = false

[dependencies]
# The HTTP client follows the proxy settings (`featherplay_proxy::client`).
featherplay-proxy = { path = "../proxy" }
# Rich presence over Discord's local IPC pipe.
discord-rich-presence = { workspace = true }
featherplay-core = { path = "../core" }
featherplay-store = { path = "../store" }
global-hotkey = { workspace = true }
# Its warnings reach the app's log file.
log = { workspace = true }
# SponsorBlock: one GET per music video, over the system TLS like the Last.fm client.
reqwest = { workspace = true, features = ["native-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Commands go to the controller over an unbounded tokio channel; the local API listens and
# serves on the app's runtime (`net`, `io-util`, `rt`), with hyper's header timeout (`time`).
tokio = { workspace = true, features = ["sync", "net", "io-util", "rt", "macros", "time"] }
# The local API: an HTTP/1.1 server with upgrades for its WebSocket.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true, features = ["std"] }
sha1 = { workspace = true }
getrandom = { workspace = true }
# Inflates the tray icons, which `build.rs` deflates.
flate2 = { workspace = true }

# Windows only. `tray-icon` and `souvlaki` work elsewhere too, but on Linux they bring in GTK
# and D-Bus; the Linux tray and media controls are chosen in phase 5 (ARCHITECTURE.md).
[target.'cfg(windows)'.dependencies]
# The media card (SMTC).
souvlaki = { workspace = true }
# Toasts.
tauri-winrt-notification = { workspace = true }
# The tray icon and its menu.
tray-icon = { workspace = true }
# `identity`: the AppUserModelID, the Start menu shortcut (IShellLink and its property
# store) and the HKCU registration, so the media card names the app.
windows = { workspace = true, features = [
    # `smtc`: the media card's playback rate, which souvlaki doesn't set.
    "Media",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# Renders the colour Tri-vane (apps/featherplay/ui/logo/tri-vane{,-light}{,-16,-24}.svg) for the tray.
resvg = { workspace = true }
flate2 = { workspace = true }

[lints]
workspace = true
