[package]
name = "featherplay-integrations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's integrations: hotkeys, SponsorBlock, Discord, the local API, and the commands the OS integrations send"
publish = false

[dependencies]
# The HTTP client follows the proxy settings (`featherplay_proxy::client`).
featherplay-proxy = { path = "../proxy" }
# Rich presence over Discord's local IPC pipe.
discord-rich-presence = { workspace = true }
featherplay-core = { path = "../core" }
featherplay-store = { path = "../store" }
# What talks to the OS (ARCHITECTURE.md, "Phase 2").
featherplay-platform = { path = "../platform" }
global-hotkey = { workspace = true }
# Its warnings reach the app's log file.
log = { workspace = true }
# SponsorBlock: one GET per music video. Its TLS is `featherplay-proxy`'s, as for every crate.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# Commands go to the controller over an unbounded tokio channel; the local API listens and
# serves on the app's runtime (`net`, `io-util`, `rt`), with hyper's header timeout (`time`).
tokio = { workspace = true, features = ["sync", "net", "io-util", "rt", "macros", "time"] }
# The local API: an HTTP/1.1 server with upgrades for its WebSocket.
hyper = { workspace = true, features = ["http1", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }
bytes = { workspace = true }
base64 = { workspace = true, features = ["std"] }
sha1 = { workspace = true }
getrandom = { workspace = true }

[lints]
workspace = true
