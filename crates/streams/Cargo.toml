[package]
name = "featherplay-streams"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's stream resolver: a native InnerTube request, else the yt-dlp sidecar, and the sidecar downloads"
publish = false

[dependencies]
featherplay-core = { path = "../core" }
# The HTTP clients and yt-dlp follow the proxy settings.
featherplay-proxy = { path = "../proxy" }
# What talks to the OS (ARCHITECTURE.md, "Phase 2"); its code moves in area by area.
featherplay-platform = { path = "../platform" }
# Runs YouTube's player challenges for the native request (`js.rs`).
rquickjs = { workspace = true }
# Each resolve step that fails logs a line (the app writes it to its log file).
log = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "gzip"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
# Reads deno.exe out of deno's release zip, which is plain deflate. zip's defaults add
# decoders for bzip2, lzma, xz, zstd (C), ppmd, deflate64, AES and a zopfli encoder;
# flate2's own backend (already in the tree through png) does the inflating.
zip = { workspace = true, features = ["deflate-flate2"] }
# Inflates the EJS library, which `build.rs` deflates; the same inflater zip uses. Its
# CRC-32 checks a player's saved bytecode.
flate2 = { workspace = true }

[target.'cfg(windows)'.dependencies]
# A heap for each QuickJS run (`js.rs`). The app enables these features already.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Memory",
] }

[build-dependencies]
flate2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true
