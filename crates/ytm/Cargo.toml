[package]
name = "featherplay-ytm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's YouTube Music client: the catalogue and library over ytmapi-rs, with cookie auth"
publish = false

[dependencies]
featherplay-core = { path = "../core" }
# native-tls, like the other crates: the default (rustls + aws-lc) is a second TLS stack.
# `reqwest`: hands ytmapi-rs our own client, which carries the identity headers.
ytmapi-rs = { workspace = true, features = ["native-tls", "simplified-queries", "reqwest"] }
# `json` and `gzip` (already on through ytmapi-rs): the mobile lyrics request we send ourselves.
reqwest = { workspace = true, features = ["native-tls", "json", "gzip"] }
serde = { workspace = true }
serde_json = { workspace = true }
# One line per list item ytmapi-rs can't read (`convert`), into the app's log.
log = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
