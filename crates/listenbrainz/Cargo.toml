[package]
name = "featherplay-listenbrainz"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's ListenBrainz client: now playing, listens and token checks"
publish = false

[dependencies]
# The HTTP client follows the proxy settings (`featherplay_proxy::client`).
featherplay-proxy = { path = "../proxy" }
reqwest = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

