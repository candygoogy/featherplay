[package]
name = "featherplay-lastfm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "featherplay's Last.fm client: request signing, desktop auth, scrobbling and the offline queue"
publish = false

[dependencies]
# The HTTP client follows the proxy settings (`featherplay_proxy::client`).
featherplay-proxy = { path = "../proxy" }
featherplay-core = { path = "../core" }
md-5 = { workspace = true }
reqwest = { workspace = true, features = ["native-tls", "form"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
